<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<meta name="application-name" content="ShippinTECH" />
		<meta name="apple-mobile-web-app-title" content="ShippinTECH" />
		<meta name="oauth-client-id" content="" />
		<meta name="oauth-scopes" content="" />
		<meta name="referrer" content="no-referrer" />
		<script>
			try {
				var theme = localStorage.getItem('shippin-theme');
				var dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
				if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
				if (dark) document.documentElement.classList.add('dark');
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
