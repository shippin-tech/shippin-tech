# Two shippin.tech nodes, one FoundationDB cluster, one S3 bucket, one NATS coordinator.
# Build with Dockerfile.fdb, which uses `--features "scale,enterprise"`.
#
# The file mounted at /etc/shippin.tech/config.json is only the shared data store.
# On first boot, a scale binary that sees the four shippin.tech_SCALE_* variables below
# writes the S3 BlobStore and NATS Coordinator singletons into that database when
# they are empty. A second node leaves an existing singleton alone.
# tests/src/cluster/scale.rs checks the same layout: different node ids, a message
# appended on node A fetched on node B, and a second tenant that cannot read it:
#   RUST_MIN_STACK=33554432 STORE=FoundationDb cargo test -p tests --features scale -- --ignored scale_two_nodes

services:
  foundationdb:
    image: foundationdb/foundationdb:7.4.6
    environment:
      FDB_NETWORKING_MODE: container
    volumes:
      - fdb-config:/var/fdb
    tmpfs:
      - /var/fdb/data
      - /var/fdb/logs
    healthcheck:
      test: ["CMD-SHELL", "fdbcli --exec 'status' --timeout 3 >/dev/null 2>&1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  fdb-init:
    image: foundationdb/foundationdb:7.4.6
    depends_on:
      foundationdb:
        condition: service_healthy
    volumes:
      - fdb-config:/var/fdb
      - ../../tests/docker/scripts/init-fdb.sh:/init-fdb.sh:ro
    entrypoint: ["bash", "-c", "bash /init-fdb.sh && chmod a+r /var/fdb/fdb.cluster"]

  minio:
    image: cgr.dev/chainguard/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    tmpfs:
      - /data

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    volumes:
      - ../../tests/docker/scripts/init-minio.sh:/init-minio.sh:ro
    entrypoint: ["bash", "/init-minio.sh"]

  nats:
    image: nats:latest
    command: "--addr 0.0.0.0 --port 4222 --http_port 8222"

  node-a:
    build:
      context: ../..
      dockerfile: Dockerfile.fdb
    depends_on:
      fdb-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      nats:
        condition: service_started
    environment:
      shippin.tech_HOSTNAME: node-a.shippin.tech
      shippin.tech_SCALE_S3_ENDPOINT: http://minio:9000
      shippin.tech_SCALE_S3_ACCESS_KEY: minioadmin
      shippin.tech_SCALE_S3_SECRET_KEY: minioadmin
      shippin.tech_SCALE_S3_BUCKET: shippin.tech
      shippin.tech_SCALE_S3_REGION: eu-central-1
      shippin.tech_SCALE_NATS_ADDRESS: nats:4222
    volumes:
      - fdb-config:/var/fdb:ro
      - ./config.json:/etc/shippin.tech/config.json:ro
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:993:993"

  node-b:
    build:
      context: ../..
      dockerfile: Dockerfile.fdb
    depends_on:
      node-a:
        condition: service_healthy
    environment:
      shippin.tech_HOSTNAME: node-b.shippin.tech
      shippin.tech_SCALE_S3_ENDPOINT: http://minio:9000
      shippin.tech_SCALE_S3_ACCESS_KEY: minioadmin
      shippin.tech_SCALE_S3_SECRET_KEY: minioadmin
      shippin.tech_SCALE_S3_BUCKET: shippin.tech
      shippin.tech_SCALE_S3_REGION: eu-central-1
      shippin.tech_SCALE_NATS_ADDRESS: nats:4222
    volumes:
      - fdb-config:/var/fdb:ro
      - ./config.json:/etc/shippin.tech/config.json:ro
    ports:
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:1993:993"

volumes:
  fdb-config:
