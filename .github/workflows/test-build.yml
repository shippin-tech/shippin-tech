name: Test container build

# Pre-release: an image is built only for a tagged version (v*) or on demand.
# Plain pushes to main never start a build.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scale:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image coordinates
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-scale" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build scale image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.fdb
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=scale-amd64
          cache-to: type=gha,mode=max,scope=scale-amd64
      - name: Package server bundle
        run: tar -czf server-bundle.tar.gz -C deploy compose.yaml server.env.example config.json update.sh README.md control-plan.template.json
      - uses: actions/upload-artifact@v4
        with:
          name: server-bundle
          path: server-bundle.tar.gz
      - name: Deployment reference
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo '### Deploy this build' >> "$GITHUB_STEP_SUMMARY"
          echo "\`bash update.sh $IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
