name: ${COMPOSE_PROJECT_NAME:-shippin-test}

# One mail node. With COMPOSE_PROFILES=bundled in server.env the same host also runs
# FoundationDB, object storage and NATS, each with persistent data, so a clean host
# needs nothing else. Without it, point S3_*, NATS_ADDRESS and ./fdb.cluster at
# services you run yourself.
services:
  mail:
    image: ${SHIPPIN_IMAGE:?Set SHIPPIN_IMAGE to a published image digest}
    # The server's own settings file lives in the persistent data volume, never in
    # the container layer. update.sh seeds it on first run and on upgrades.
    command: [--config, /var/lib/shippin.tech/config.json]
    restart: unless-stopped
    hostname: ${MAIL_HOSTNAME:?Set a unique MAIL_HOSTNAME for this node}
    depends_on:
      fdb-init: {condition: service_completed_successfully, required: false}
      objects-init: {condition: service_completed_successfully, required: false}
      nats: {condition: service_started, required: false}
    environment:
      shippin.tech_HOSTNAME: ${MAIL_HOSTNAME}
      # Optional break-glass administrator (user:password). Without it, a new server
      # prints a one-time setup key for "admin" until the first administrator exists.
      shippin.tech_RECOVERY_ADMIN: ${RECOVERY_ADMIN:-}
      # How long that setup key works, in hours; a restart after that prints a new one.
      shippin.tech_SETUP_KEY_HOURS: ${SETUP_KEY_HOURS:-24}
      # Self-service free plan: customers sign up with their own domain at /signup.
      # Closed unless PANEL_SIGNUP=open. Domain ownership is always proven by DNS here.
      shippin.tech_PANEL_SIGNUP: ${PANEL_SIGNUP:-closed}
      shippin.tech_TRACE_DAYS: ${TRACE_DAYS:-7}
      shippin.tech_KEEP_DELETED_DAYS: ${KEEP_DELETED_DAYS:-30}
      shippin.tech_MASKED_LIMIT: ${MASKED_LIMIT:-50}
      # Domains shared with another mail system (deploy/HYBRID-GOOGLE-WORKSPACE.md).
      shippin.tech_SPLIT_DOMAINS: ${SPLIT_DOMAINS:-}
      # The Google Drive link; off unless these three are set (deploy/README.md).
      shippin.tech_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      shippin.tech_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      shippin.tech_GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-}
      shippin.tech_PANEL_MAX_DOMAINS: ${PANEL_MAX_DOMAINS:-100}
      shippin.tech_PANEL_MAILBOXES: ${PANEL_MAILBOXES:-5}
      shippin.tech_PANEL_ALIASES: ${PANEL_ALIASES:-20}
      shippin.tech_PANEL_MAILBOX_MB: ${PANEL_MAILBOX_MB:-1024}
      shippin.tech_PANEL_SIGNUPS_PER_HOUR: ${PANEL_SIGNUPS_PER_HOUR:-10}
      shippin.tech_PANEL_SENDS_PER_DAY: ${PANEL_SENDS_PER_DAY:-200}
      shippin.tech_SCALE_S3_ENDPOINT: ${S3_ENDPOINT:?Set S3_ENDPOINT}
      shippin.tech_SCALE_S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      shippin.tech_SCALE_S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      shippin.tech_SCALE_S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
      shippin.tech_SCALE_S3_REGION: ${S3_REGION:-us-east-1}
      shippin.tech_SCALE_NATS_ADDRESS: ${NATS_ADDRESS:?Set NATS_ADDRESS}
    volumes:
      - ./config.json:/etc/shippin.tech/seed.json:ro
      - fdb-config:/var/fdb
      - node-data:/var/lib/shippin.tech
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_HOST_PORT:-8080}:8080"
      - "${MAIL_BIND:-127.0.0.1}:${SMTP_HOST_PORT:-25}:25"
      - "${MAIL_BIND:-127.0.0.1}:${SMTPS_HOST_PORT:-465}:465"
      - "${MAIL_BIND:-127.0.0.1}:${SUBMISSION_HOST_PORT:-587}:587"
      - "${MAIL_BIND:-127.0.0.1}:${IMAPS_HOST_PORT:-993}:993"
      - "${HTTPS_BIND:-127.0.0.1}:${HTTPS_HOST_PORT:-443}:443"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # ---- bundled backing services (COMPOSE_PROFILES=bundled) ---------------------
  foundationdb:
    profiles: [bundled]
    image: foundationdb/foundationdb:7.4.6
    restart: unless-stopped
    environment:
      FDB_NETWORKING_MODE: container
    volumes:
      - fdb-config:/var/fdb
      - fdb-data:/var/fdb/data
      - fdb-logs:/var/fdb/logs
    healthcheck:
      test: [CMD-SHELL, "fdbcli --exec 'status' --timeout 3 >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 40

  fdb-init:
    profiles: [bundled]
    image: foundationdb/foundationdb:7.4.6
    depends_on:
      foundationdb: {condition: service_started}
    volumes:
      - fdb-config:/var/fdb
    entrypoint: [bash, -c]
    command:
      - |
        for attempt in $$(seq 1 40); do
          if fdbcli --exec 'status minimal' --timeout 5 2>&1 | grep -q 'The database is available'; then
            chmod a+r /var/fdb/fdb.cluster; exit 0
          fi
          fdbcli --exec 'configure new single ssd' --timeout 5 >/dev/null 2>&1 || true
          sleep 2
        done
        echo 'FoundationDB did not become available' >&2; exit 1

  minio:
    profiles: [bundled]
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
    command: server /data
    volumes:
      - objects:/data

  # MinIO's client images are no longer public, so the client binary is copied out
  # of Chainguard's distroless image into a volume and run from Alpine.
  objects-client:
    profiles: [bundled]
    image: cgr.dev/chainguard/minio-client:latest
    user: "0"
    entrypoint: [mc]
    command: [cp, /usr/bin/mc, /tools/mc]
    volumes:
      - tools:/tools

  objects-init:
    profiles: [bundled]
    image: alpine:3.22
    depends_on:
      minio: {condition: service_started}
      objects-client: {condition: service_completed_successfully}
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - tools:/tools:ro
    entrypoint: [/bin/sh, -c]
    command:
      - 'export HOME=/tmp; cp /tools/mc /tmp/mc && chmod +x /tmp/mc; for i in $$(seq 1 60); do /tmp/mc alias set s3 http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" >/dev/null 2>&1 && exec /tmp/mc mb --ignore-existing "s3/$$S3_BUCKET"; sleep 2; done; echo "object storage did not start" >&2; exit 1'

  nats:
    profiles: [bundled]
    image: nats:2
    restart: unless-stopped
    command: [--jetstream, --store_dir, /data]
    volumes:
      - nats-data:/data

  # Runs FoundationDB backups and restores for backup.sh into ./backups.
  fdb-backup-agent:
    profiles: [bundled]
    image: foundationdb/foundationdb:7.4.6
    restart: unless-stopped
    depends_on:
      fdb-init: {condition: service_completed_successfully}
    entrypoint: [backup_agent, -C, /var/fdb/fdb.cluster]
    volumes:
      - fdb-config:/var/fdb:ro
      - ./backups:/backups

  # One-off object storage copies for backup.sh (docker compose --profile tools run).
  objects-tool:
    profiles: [tools]
    image: alpine:3.22
    depends_on:
      objects-client: {condition: service_completed_successfully}
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - tools:/tools:ro
      - ./backups:/backups

volumes:
  node-data:
  fdb-config:
  fdb-data:
  fdb-logs:
  objects:
  nats-data:
  tools:
